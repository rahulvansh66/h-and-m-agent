[project]
name = "h-and-m-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langfuse>=5.0.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=1.30.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
    "watchtower>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hm_agent"]
