# Shared defaults for every environment. Per-environment files (dev.yaml, ...) are
# deep-merged on top of this one; only put values there that differ.
# Secrets (API keys, DSNs) never go in these files; they live in .env.

environment: base

# Groq model names per role
llm:
  small: openai/gpt-oss-20b
  big: openai/gpt-oss-120b

rag:
  collection: troubleshooting_kb  # Qdrant collection holding the support knowledge base
  embedding: BAAI/bge-small-en-v1.5   # local fastembed model; must match the one used to ingest the collection
  top_k: 2                        # documents fetched per retrieval
  max_retries: 1                  # query-rewrite retries allowed when the answer has no citation
  min_score: 0.5                  # relevance gate: chunks scoring below this are dropped before the LLM
  condense_history_messages: 6    # most recent messages given to the query-condensing step

supervisor:
  history_messages: 6             # most recent messages the supervisor sees when routing
  max_agents: 2                   # agents one message may fan out to (multi-intent messages)
  synthesis_model: small          # llm size (see llm:) that composes the answer, only when the planner flags needs_combination
  branch_timeout_s: 30            # deadline for each agent call on a split turn; a slower agent becomes a pending/failed note
  sticky_max_words: 6            # short follow-ups up to this many words skip the routing LLM call; 0 turns it off

# Fashion agent: product search over a Qdrant collection built from product_catalog.
fashion:
  collection: product_catalog     # Qdrant collection (built by scripts/fashion/ingest_catalog.py)
  embedding: BAAI/bge-small-en-v1.5   # fastembed model; must match the one used by scripts/fashion/ingest_catalog.py
  top_k: 5                        # products fetched per search
  min_score: 0.5                  # relevance gate: products scoring below this are dropped
  mcp_host: 127.0.0.1             # long-lived MCP server, so the embedding model loads once
  mcp_port: 8005

# A2A: each agent runs as its own HTTP service; the supervisor calls them as an A2A client.
a2a:
  host: 127.0.0.1                 # interface the agent services bind to and the supervisor calls
  request_timeout_s: 90           # supervisor-side timeout for one agent call
  history_messages: 6             # most recent prior messages sent to an agent as context
  agents:
    order_management:
      port: 8001
    customer_support:
      port: 8002
    shipment_tracking:
      port: 8003                  # slow carrier lookups: streams progress; push webhook is the fallback
    fashion:
      port: 8004
  webhook_port: 8010              # supervisor-side receiver for push notifications from agents
  push_receiver_enabled: true     # false = stream-only: no :8010 listener; a lost stream returns the apology (env PUSH_RECEIVER_ENABLED overrides)

# AgentCore Runtime entrypoint of the supervisor (python -m hm_agent.runtime.entrypoint).
runtime:
  port: 8080                      # port the Runtime contract requires for the HTTP protocol
  pool_max_size: 4                # Neon connections held for the checkpointer
  max_message_chars: 2000         # longest customer message accepted

# Dummy carrier lookup used by the shipment_tracking agent.
shipment:
  carrier_delay_s: 20             # simulated wait for the carrier / warehouse system

# End-user authentication: the OIDC access token the supervisor entrypoint and agents verify.
# The issuer comes from env AUTH0_TENANT (.env). Off locally so today's unauthenticated behaviour is unchanged; deployments switch it on.
auth:
  enabled: false                  # verify user tokens (env AUTH_ENABLED overrides)
  audience: https://hm-agent/api  # token `aud` this service accepts
  customer_claim: https://hm-agent/customer_id  # namespaced claim carrying the verified customer id
  jwks_cache_ttl_s: 3600          # how long fetched signing keys are cached in memory

# AWS: region and request signing for calls between AgentCore Runtimes.
aws:
  region: us-east-1
  sigv4_enabled: false            # sign A2A requests with IAM credentials (env SIGV4_ENABLED overrides)

database:
  checkpoint_schema: checkpoints  # Neon schema holding the LangGraph checkpoint tables

defaults:
  customer_id: cust001

logging:
  level: WARNING
  cloudwatch:
    enabled: false                # ship logs to AWS CloudWatch Logs (off by default: local first)
    region: us-east-1
    log_group: /hm-agent/base     # must match the group created in infra/cloudwatch

tracing:
  tags: [supervisor]

# Langfuse-managed prompts: code constants stay as fallbacks, Langfuse holds the versioned copies.
langfuse:
  prompt_label: production        # label fetched at runtime (dev.yaml uses `latest` to try unpublished edits)
  prompt_cache_ttl_s: 60          # client-side prompt cache; a label change reaches the app within this time

# Amazon Bedrock Guardrails (toxicity, PII masking, prompt-injection). Pay-per-use, so off until the guardrail
# is created with scripts/aws/create_guardrail.py and its id is exported as BEDROCK_GUARDRAIL_ID (.env).
guardrails:
  enabled: false                  # env GUARDRAILS_ENABLED overrides
  version: DRAFT                  # guardrail version applied (env BEDROCK_GUARDRAIL_VERSION overrides)
  region: us-east-1
  check_input: true               # screen the customer message before the graph runs
  check_output: true              # screen the final reply (masks PII, blocks harmful text)
  fail_closed_input: true         # input check unavailable -> refuse the turn (output check always fails open)
  blocked_reply: I'm sorry, but I can't help with that request. Is there something else about your H&M order or products I can help with?

# Offline evaluation (python -m hm_agent.evals) and online scoring.
evals:
  dataset: hm-golden-v1           # Langfuse dataset name; source file is data/evals/golden.jsonl
  judge_model: big                # llm size (see llm:) used as the RAGAS / DeepEval judge
  online_scores: true             # write deterministic per-turn scores to Langfuse
  online_relevancy: false         # also score each reply's relevancy to the question with local embeddings (loads the
                                  # fastembed model, ~130 MB, in the supervisor process; env ONLINE_RELEVANCY_ENABLED overrides)
  # Notional USD per 1M tokens (Groq list prices; the free tier is not billed). Used for cost scores.
  pricing:
    openai/gpt-oss-20b: {input: 0.10, output: 0.50}
    openai/gpt-oss-120b: {input: 0.15, output: 0.75}
  # Regression gate: a run exits non-zero if a run-level mean falls below a `min` or above a `max`.
  thresholds:
    routing_exact_match: {min: 0.9}
    tool_name_f1: {min: 0.9}
    tool_args_correct: {min: 0.9}
    faithfulness: {min: 0.8}
    answer_similarity: {min: 0.7}     # provisional: set from 3 observed items (0.80-0.90); recheck once more items exist
    answer_relevancy_sim: {min: 0.6}  # provisional, same reason
    retrieval_recall: {min: 1.0}      # every gold chunk must reach the LLM
    retrieval_hit_rate: {min: 1.0}
    guardrail_action_correct: {min: 1.0}
    pii_leak: {max: 0.0}
    prompt_leak: {max: 0.0}
    cross_customer_leak: {max: 0.0}
    guardrail_false_positive: {max: 0.0}
    ttlt_s_p90: {max: 30.0}
