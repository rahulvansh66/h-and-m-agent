# Shared defaults for every environment. Per-environment files (dev.yaml, ...) are
# deep-merged on top of this one; only put values there that differ.
# Secrets (API keys, DSNs) never go in these files; they live in .env.

environment: base

# Groq model names per role
llm:
  small: openai/gpt-oss-20b
  big: openai/gpt-oss-120b

# Local embedding model (fastembed). Must match the model used to ingest the Qdrant collection.
embedding: BAAI/bge-small-en-v1.5

rag:
  collection: troubleshooting_kb  # Qdrant collection holding the support knowledge base
  top_k: 2                        # documents fetched per retrieval
  max_retries: 1                  # query-rewrite retries allowed when the answer has no citation
  min_score: 0.5                  # relevance gate: chunks scoring below this are dropped before the LLM
  condense_history_messages: 6    # most recent messages given to the query-condensing step

supervisor:
  history_messages: 6             # most recent messages the supervisor sees when routing

# Fashion agent: product search over a Qdrant collection built from product_catalog.
fashion:
  collection: product_catalog     # Qdrant collection (built by scripts/fashion/ingest_catalog.py)
  top_k: 5                        # products fetched per search
  min_score: 0.5                  # relevance gate: products scoring below this are dropped
  mcp_host: 127.0.0.1             # long-lived MCP server, so the embedding model loads once
  mcp_port: 8005

# A2A: each agent runs as its own HTTP service; the supervisor calls them as an A2A client.
a2a:
  host: 127.0.0.1                 # interface the agent services bind to and the supervisor calls
  request_timeout_s: 90           # supervisor-side timeout for one agent call
  history_messages: 6             # most recent prior messages sent to an agent as context
  agents:
    order_management:
      port: 8001
    customer_support:
      port: 8002
    shipment_tracking:
      port: 8003                  # slow carrier lookups: streams progress; push webhook is the fallback
    fashion:
      port: 8004
  webhook_port: 8010              # supervisor-side receiver for push notifications from agents
  push_receiver_enabled: true     # false = stream-only: no :8010 listener; a lost stream returns the apology (env PUSH_RECEIVER_ENABLED overrides)

# FastAPI layer in front of the supervisor graph (python -m hm_agent.api).
api:
  host: 127.0.0.1
  port: 8000
  cors_origins: []                # browser origins allowed to call the API (empty = none)
  max_message_chars: 2000         # longest customer message accepted
  rate_limit_per_min: 10          # chat requests per customer per minute (protects the Groq free tier)
  pool_max_size: 4                # Neon connections held for the checkpointer

# AgentCore Runtime entrypoint of the supervisor (python -m hm_agent.runtime.entrypoint).
runtime:
  port: 8080                      # port the Runtime contract requires for the HTTP protocol
  pool_max_size: 4                # Neon connections held for the checkpointer
  max_message_chars: 2000         # longest customer message accepted

# Dummy carrier lookup used by the shipment_tracking agent.
shipment:
  carrier_delay_s: 20             # simulated wait for the carrier / warehouse system

# End-user authentication: the OIDC access token the supervisor entrypoint and agents verify.
# The issuer comes from env AUTH0_TENANT (.env). Off locally so today's unauthenticated behaviour is unchanged; deployments switch it on.
auth:
  enabled: false                  # verify user tokens (env AUTH_ENABLED overrides)
  audience: https://hm-agent/api  # token `aud` this service accepts
  customer_claim: https://hm-agent/customer_id  # namespaced claim carrying the verified customer id
  jwks_cache_ttl_s: 3600          # how long fetched signing keys are cached in memory

# AWS: region and request signing for calls between AgentCore Runtimes.
aws:
  region: us-east-1
  sigv4_enabled: false            # sign A2A requests with IAM credentials (env SIGV4_ENABLED overrides)

database:
  checkpoint_schema: checkpoints  # Neon schema holding the LangGraph checkpoint tables

defaults:
  customer_id: cust001

logging:
  level: WARNING
  cloudwatch:
    enabled: false                # ship logs to AWS CloudWatch Logs (off by default: local first)
    region: us-east-1
    log_group: /hm-agent/base     # must match the group created in infra/cloudwatch

tracing:
  tags: [supervisor]
