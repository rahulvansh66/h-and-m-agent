# Development overrides, merged over base.yaml (selected by APP_ENV=dev, the default).

environment: dev

logging:
  level: INFO
  cloudwatch:
    log_group: /hm-agent/dev

tracing:
  tags: [dev, supervisor]

evals:
  online_relevancy: true

langfuse:
  prompt_label: latest            # dev runs the newest prompt version, so edits can be tried before promoting to production
